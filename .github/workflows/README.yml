name: Convert Markdown to HTML, Compress and Deploy

on:
  push:
    branches: [main]
    paths: ['README.md', 'pandoc.css']

jobs:
  convert-compress-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout mac-config
        uses: actions/checkout@v4
        with:
          path: mac-config

      - name: Checkout verygoodbye
        uses: actions/checkout@v4
        with:
          repository: summer19940609/verygoodbye
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: verygoodbye

      - name: Install pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: 'latest'

      - name: Install Python and htmlmin
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install htmlmin

      - name: Convert Markdown to HTML
        run: |
          cd mac-config
          pandoc --standalone --self-contained --css pandoc.css README.md --output README.html --toc --template template.html
          # 插入中文更新时间到body标签内最上方
          sed -i '/<body>/a \    <p>更新时间: '"$(date +"%Y-%m-%d")"'</p>\n' README.html
          echo "<!-- Generated at $(date) -->" >> README.html

      - name: Compress HTML with Python
        run: |
          cd mac-config
          # 备份原始HTML文件
          cp README.html README.original.html
          
          # 使用Python进行HTML压缩
          python3 -c "
import htmlmin
import re

# 读取HTML文件
with open('README.html', 'r', encoding='utf-8') as f:
    content = f.read()

# 使用htmlmin进行压缩
minified = htmlmin.minify(
    content,
    remove_comments=True,        # 移除注释
    remove_empty_space=True,     # 移除空行和空格
    remove_all_empty_space=True, # 移除所有空白
    reduce_empty_attributes=True # 减少空属性
)

# 进一步优化：移除标签间的空白
minified = re.sub(r'>\s+<', '><', minified)
# 移除行首行尾空白
minified = re.sub(r'^\s+|\s+$', '', minified, flags=re.MULTILINE)

# 写入压缩后的内容
with open('README.html', 'w', encoding='utf-8') as f:
    f.write(minified)
"

          # 输出压缩信息
          original_size=$(wc -c < README.original.html)
          compressed_size=$(wc -c < README.html)
          reduction=$((100 - compressed_size * 100 / original_size))
          echo "HTML压缩完成"
          echo "原始大小: ${original_size}字节"
          echo "压缩后大小: ${compressed_size}字节"
          echo "压缩率: ${reduction}%"
          
          # 清理备份文件
          rm README.original.html

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Copy and Commit
        run: |
          cp mac-config/README.html verygoodbye/mac.html
          cd verygoodbye
          git add mac.html
          git commit -m "Auto-update mac.html (更新时间: $(date +"%Y-%m-%d"))"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
