name: Convert Markdown to HTML and Deploy

on:
  push:
    branches: [main]
    paths: ['win_xnj.md', 'pandoc.css']
  workflow_dispatch:  # 添加手动触发功能

jobs:
  convert-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout mac-config
        uses: actions/checkout@v4
        with:
          path: mac-config

      - name: Checkout verygoodbye
        uses: actions/checkout@v4
        with:
          repository: summer19940609/verygoodbye
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: verygoodbye

      - name: Install pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: 'latest'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Convert Markdown to HTML
        run: |
          cd mac-config
          pandoc --standalone --self-contained --css pandoc.css win_xnj.md --output win_xnj.html --template template.html
          # 在body标签内最上方插入中文编辑时间和换行，使用YYYY-MM-DD格式
          sed -i '/<body>/a \    <p style="margin-top: 0; margin-bottom: 1em;">更新时间: '"$(date +"%Y-%m-%d")"'</p>\n' win_xnj.html
          echo "<!-- Generated at $(date) -->" >> win_xnj.html

      - name: Compress HTML with html-minifier-terser
        run: |
          cd mac-config
          npx html-minifier-terser --collapse-whitespace --remove-comments --remove-optional-tags --remove-redundant-attributes --remove-script-type-attributes --remove-tag-whitespace --use-short-doctype --minify-css true --minify-js true win_xnj.html -o win_xnj.html

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Copy and Commit
        run: |
          cp mac-config/win_xnj.html verygoodbye/win-xnj.html
          cd verygoodbye
          git add win-xnj.html
          git commit -m "Auto-update win-xnj.html (更新时间: $(date +"%Y-%m-%d"))"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
