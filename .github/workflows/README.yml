name: Convert Markdown to HTML and Deploy

on:
  push:
    branches: [main]
    paths: ['README.md', 'pandoc.css']

jobs:
  convert-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout mac-config
        uses: actions/checkout@v4
        with:
          path: mac-config

      - name: Checkout verygoodbye
        uses: actions/checkout@v4
        with:
          repository: summer19940609/verygoodbye
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: verygoodbye

      - name: Install pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: 'latest'

      - name: Convert Markdown to HTML
        run: |
          cd mac-config
          pandoc --standalone --self-contained --css pandoc.css README.md --output README.html --toc --toc-depth=6
          # 插入中文更新时间到body标签内最上方
          sed -i '/<body>/a \    <p>更新时间: '"$(date +"%Y-%m-%d")"'</p>\n' README.html
          echo "<!-- Generated at $(date) -->" >> README.html

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Copy and Commit
        run: |
          cp mac-config/README.html verygoodbye/mac.html
          cd verygoodbye
          git add mac.html
          git commit -m "Auto-update mac.html (更新时间: $(date +"%Y-%m-%d"))"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
