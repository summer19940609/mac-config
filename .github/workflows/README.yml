name: Convert README Markdown to HTML, Compress and Deploy

on:
  push:
    branches: [main]
    paths: ['README.md', 'pandoc.css']
  workflow_dispatch:  # 添加手动触发功能

jobs:
  convert-compress-and-deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout mac-config
        uses: actions/checkout@v4
        with:
          path: mac-config

      - name: Checkout verygoodbye
        uses: actions/checkout@v4
        with:
          repository: summer19940609/verygoodbye
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: verygoodbye

      - name: Install pandoc
        uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: 'latest'

      - name: Install Node.js without cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'npm'  # 设置为'npm'而不是false，或者完全移除这行

      - name: Install html-minifier globally
        run: npm install -g html-minifier

      - name: Convert Markdown to HTML
        run: |
          cd mac-config
          pandoc README.md -o README.html \
            --standalone \
            --self-contained \
            --css pandoc.css \
            --toc \
            --toc-depth=3 \
            --number-sections \
            --template template.html
            --metadata title="Mac配置" \
            --variable lang=zh-CN
          # 插入中文更新时间到body标签内最上方
          sed -i '/<body>/a \    <p>更新时间: '"$(date +"%Y-%m-%d")"'</p>' README.html
          echo "<!-- Generated at $(date) -->" >> README.html

      - name: Compress HTML with html-minifier
        run: |
          cd mac-config
          # 备份原始HTML文件
          cp README.html README.original.html
          
          # 压缩HTML文件
          html-minifier \
            --collapse-whitespace \
            --remove-comments \
            --remove-optional-tags \
            --remove-redundant-attributes \
            --remove-script-type-attributes \
            --remove-tag-whitespace \
            --use-short-doctype \
            --minify-css true \
            --minify-js true \
            README.html -o README.min.html
          
          # 替换原文件
          mv README.min.html README.html
          
          # 输出压缩信息
          original_size=$(wc -c < README.original.html)
          compressed_size=$(wc -c < README.html)
          reduction=$((100 - compressed_size * 100 / original_size))
          echo "HTML压缩完成"
          echo "原始大小: ${original_size}字节"
          echo "压缩后大小: ${compressed_size}字节"
          echo "压缩率: ${reduction}%"
          
          # 清理备份文件
          rm README.original.html

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Copy and Commit
        run: |
          cp mac-config/README.html verygoodbye/mac.html
          cd verygoodbye
          git add mac.html
          git commit -m "Auto-update mac.html (更新时间: $(date +"%Y-%m-%d"))"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
